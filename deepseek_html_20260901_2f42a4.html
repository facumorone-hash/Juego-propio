<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚗 GTA VI - Proyecto Base</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    
    #info {
      position: absolute; top: 20px; left: 20px;
      color: white; background: rgba(0,0,0,0.6);
      padding: 8px 16px; border-radius: 8px;
      font-size: 14px; z-index: 10;
      border: 1px solid #ffcc00;
      pointer-events: none;
    }
    
    #controls {
      position: absolute; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      color: #aaa; background: rgba(0,0,0,0.7);
      padding: 8px 20px; border-radius: 30px;
      font-size: 13px; z-index: 10;
      border: 1px solid #444;
      display: flex; gap: 20px;
      flex-wrap: wrap; justify-content: center;
      pointer-events: none;
    }
    #controls span { color: #ffcc00; font-weight: bold; }
    
    #hud {
      position: absolute; bottom: 100px; left: 20px;
      color: white; background: rgba(0,0,0,0.7);
      padding: 12px 18px; border-radius: 12px;
      border: 1px solid #555; min-width: 200px;
      z-index: 10; font-size: 14px;
      backdrop-filter: blur(4px);
    }
    #hud .bar { width: 180px; height: 8px; background: #222; border-radius: 4px; margin: 3px 0; overflow: hidden; }
    #hud .fill { height: 100%; transition: width 0.2s; }
    .hud-row { display: flex; justify-content: space-between; margin: 2px 0; }
    
    #timeDisplay {
      position: absolute; top: 20px; right: 20px;
      color: white; background: rgba(0,0,0,0.5);
      padding: 4px 12px; border-radius: 20px;
      font-size: 14px; z-index: 10;
      border: 1px solid #444;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">🚗 GTA VI - Proyecto Base</div>
  <div id="timeDisplay">🌞 12:00</div>
  
  <div id="hud">
    <div class="hud-row"><span>❤️ <span id="healthDisplay">100</span>%</span><span>💰 $<span id="moneyDisplay">1000</span></span></div>
    <div class="bar"><div class="fill" id="healthFill" style="width:100%; background:#e74c3c;"></div></div>
    <div class="hud-row"><span>🔫 <span id="weaponDisplay">pistol</span></span><span>⭐ <span id="wantedDisplay">0</span></span></div>
    <div class="hud-row" style="font-size:12px; color:#aaa;"><span id="missionDisplay">Sin misión</span></div>
  </div>
  
  <div id="controls">
    <span>WASD</span> Moverse <span>Mouse</span> Mirar <span>Click</span> Disparar
    <span>E</span> Coche <span>Espacio</span> Saltar <span>F</span> Misión
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
